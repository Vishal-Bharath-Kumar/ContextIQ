# Kustomize strategic merge patch — sets storageClassName on Redis PVC.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: contextiq-data
spec:
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: contextiq-encrypted-gp3
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
