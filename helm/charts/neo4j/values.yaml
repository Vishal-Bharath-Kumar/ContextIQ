neo4j:
  name: contextiq-neo4j

  # AC-2: Causal Cluster — 3 core members with Raft consensus
  clusteringConfig:
    serverMode:             CORE    # all 3 pods are full cluster members
    minimumCoreClusterSize: 3

  # Neo4j version pin
  image:
    customImage: neo4j:5.20.0-enterprise

  # Enterprise license required for Causal Clustering
  env:
    NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    # Vault Agent overwrites NEO4J_AUTH at runtime (AC-6); this placeholder is
    # required by the chart but never reaches a real instance.
    NEO4J_AUTH: "neo4j/PLACEHOLDER"

  config:
    dbms.memory.heap.initial_size:               "2G"
    dbms.memory.heap.max_size:                   "4G"
    dbms.memory.pagecache.size:                  "4G"
    dbms.connector.bolt.enabled:                 "true"
    dbms.connector.bolt.advertised_address:      ":7687"
    dbms.connector.http.enabled:                 "true"
    # AC-7: Prometheus metrics endpoint
    dbms.metrics.prometheus.enabled:             "true"
    dbms.metrics.prometheus.endpoint:            "0.0.0.0:2004"
    # Cluster settings
    dbms.cluster.raft.log.rotation.size:         "64m"

  resources:
    requests: { cpu: "1",    memory: "8Gi"  }
    limits:   { cpu: "4",    memory: "16Gi" }

  # Encrypted PVC (TASK-US048-04)
  volumes:
    data:
      mode: volume
      volume:
        persistentVolumeClaim:
          claimName: ""    # auto-created by StatefulSet VolumeClaimTemplate
    volumeClaimTemplates:
      data:
        storageClassName: contextiq-encrypted-gp3
        accessModes:      ["ReadWriteOnce"]
        storage:          50Gi

  # AC-6: Vault Agent init-container injects Neo4j admin credentials before startup
  podAnnotations:
    vault.hashicorp.com/agent-inject:                "true"
    vault.hashicorp.com/role:                        "agent-worker"
    vault.hashicorp.com/agent-pre-populate-only:     "true"    # init-only; credentials are dynamic
    vault.hashicorp.com/agent-inject-secret-neo4j:   "database/neo4j/creds/agent-worker"
    vault.hashicorp.com/agent-inject-template-neo4j: |
      {{- with secret "database/neo4j/creds/agent-worker" -}}
      export NEO4J_AUTH="neo4j/{{ .Data.password }}"
      export NEO4J_USERNAME="{{ .Data.username }}"
      export NEO4J_PASSWORD="{{ .Data.password }}"
      {{- end }}

  # AC-2: spread cluster cores across distinct K8s nodes for fault isolation
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: neo4j
          topologyKey: kubernetes.io/hostname

  # PDB: quorum requires 2 of 3 cores — tolerate only 1 pod down at a time
  podDisruptionBudget:
    enabled:      true
    minAvailable: 2

  # AC-7: Prometheus ServiceMonitor for port 2004
  metrics:
    enabled: true
    serviceMonitor:
      enabled:   true
      namespace: contextiq-observability
      port:      prometheus    # named port 2004
      labels:
        app.kubernetes.io/part-of: contextiq
