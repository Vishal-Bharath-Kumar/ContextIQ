apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: contextiq
  # Multi-source: upstream MinIO Helm chart + custom values from git ($values)
  sources:
    # Source 1: upstream minio Helm chart from charts.min.io
    - repoURL:        https://charts.min.io
      chart:          minio
      targetRevision: "5.0.14"    # pinned; matches Chart.yaml dependency version
      helm:
        valueFiles:
          - $values/helm/charts/minio/values.yaml
          - $values/helm/charts/minio/values-prod.yaml
    # Source 2: git repo supplying the custom values files (referenced as $values above)
    - repoURL:        https://github.com/your-org/contextiq.git
      targetRevision: HEAD
      ref:            values
  destination:
    server:    https://kubernetes.default.svc
    namespace: contextiq-infra
  syncPolicy:
    automated:
      prune:    false    # never auto-prune a stateful data store
      selfHeal: true
    syncOptions:
      - CreateNamespace=false    # namespace managed by TASK-US045-01
      - ApplyOutOfSyncOnly=true
  ignoreDifferences:
    - group: apps
      kind:  StatefulSet
      jsonPointers:
        - /spec/replicas    # ignore manual replica adjustments
