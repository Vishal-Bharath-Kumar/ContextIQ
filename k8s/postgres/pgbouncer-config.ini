; k8s/postgres/pgbouncer-config.ini
; Reference configuration — actual values are managed by the Helm chart.
; Committed for documentation and manual testing purposes.
; Apply manually with: kubectl create configmap pgbouncer-config --from-file=pgbouncer.ini=k8s/postgres/pgbouncer-config.ini -n contextiq-data

[databases]
contextiq = host=postgresql.contextiq-data.svc.cluster.local port=5432 dbname=contextiq

[pgbouncer]
pool_mode              = transaction
max_client_conn        = 2000
default_pool_size      = 40
min_pool_size          = 5
reserve_pool_size      = 10
reserve_pool_timeout   = 5
auth_type              = scram-sha-256
auth_file              = /etc/pgbouncer/userlist.txt
listen_addr            = 0.0.0.0
listen_port            = 5432

; AC-5: enforce connection limit to PostgreSQL
server_connect_timeout = 10
server_idle_timeout    = 600
client_idle_timeout    = 300
query_timeout          = 0

log_connections        = 1
log_disconnections     = 1
log_pooler_errors      = 1
stats_users            = pgbouncer_monitor
