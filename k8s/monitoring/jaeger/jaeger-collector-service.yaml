apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: monitoring
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
    # AC-5: OTLPSpanExporter in TASK-US038-01 targets this service on port 4317
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: collector-grpc
      port: 14250
      targetPort: 14250
      protocol: TCP
---
# Jaeger query/UI service — accessible within the cluster and via kubectl port-forward
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: monitoring
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
    # AC-6: query by request_id (= trace_id) at http://jaeger-query:16686
    - name: query-http
      port: 16686
      targetPort: 16686
      protocol: TCP
  type: ClusterIP   # expose via Ingress or kubectl port-forward for external access
