apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pgbouncer
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: contextiq
  # Multi-source: upstream Bitnami chart + custom values from git (ArgoCD 2.6+)
  sources:
    # Source 1: upstream Bitnami pgbouncer Helm chart
    - repoURL:        https://charts.bitnami.com/bitnami
      chart:          pgbouncer
      targetRevision: "1.0.4"
      helm:
        valueFiles:
          - $values/helm/charts/pgbouncer/values.yaml
          - $values/helm/charts/pgbouncer/values-prod.yaml
    # Source 2: git repo supplying the custom values files (referenced as $values above)
    - repoURL:        https://github.com/your-org/contextiq.git
      targetRevision: HEAD
      ref:            values
  destination:
    server:    https://kubernetes.default.svc
    namespace: contextiq-data
  syncPolicy:
    automated:
      prune:    true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false    # namespace managed by TASK-US045-01
      - ApplyOutOfSyncOnly=true
  ignoreDifferences:
    - group: apps
      kind:  Deployment
      jsonPointers:
        - /spec/replicas   # ignore HPA-driven replica drift
