# k8s/cert-manager/root-ca-secret.yaml
#
# Placeholder — the actual Secret is generated and applied by:
#   scripts/cert-manager/bootstrap_root_ca.sh
#
# The script runs `kubectl create secret tls contextiq-root-ca` which produces
# a Secret with this structure. This file documents the expected shape for
# reference and is NOT applied directly (the private key is never stored in git).
#
# To verify the Secret exists after running the bootstrap script:
#   kubectl get secret contextiq-root-ca -n contextiq-infra
#
apiVersion: v1
kind: Secret
metadata:
  name:      contextiq-root-ca
  namespace: contextiq-infra
  labels:
    app.kubernetes.io/part-of:    contextiq
    app.kubernetes.io/managed-by: bootstrap_root_ca.sh
type: kubernetes.io/tls
data:
  # tls.crt and tls.key are populated at runtime by bootstrap_root_ca.sh.
  # Values are base64-encoded PEM blocks; not committed to version control.
  tls.crt: ""
  tls.key: ""
