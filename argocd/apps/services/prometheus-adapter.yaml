apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-adapter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: contextiq
  # Multi-source: upstream prometheus-community chart + custom values from git ($values)
  sources:
    # Source 1: upstream prometheus-community Helm chart
    - repoURL:        https://prometheus-community.github.io/helm-charts
      chart:          prometheus-adapter
      targetRevision: "4.10.0"    # pinned; matches Chart.yaml dependency version
      helm:
        valueFiles:
          - $values/helm/charts/prometheus-adapter/values.yaml
          - $values/helm/charts/prometheus-adapter/values-prod.yaml
    # Source 2: git repo supplying the custom values files (referenced as $values above)
    - repoURL:        https://github.com/your-org/contextiq.git
      targetRevision: HEAD
      ref:            values
  destination:
    server:    https://kubernetes.default.svc
    namespace: contextiq-observability
  syncPolicy:
    automated:
      prune:    true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false    # namespace managed by TASK-US045-01
      - ApplyOutOfSyncOnly=true
