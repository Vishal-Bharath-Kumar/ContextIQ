# Redis configuration for local development — TLS enabled, no non-TLS port.
# Used by the `redis` service in docker-compose.yml.

# Disable non-TLS port
port 0

# TLS listener
tls-port 6379
tls-cert-file /tls/redis.crt
tls-key-file /tls/redis.key
tls-ca-cert-file /tls/ca.crt

# Do NOT require client certificates (app containers present client certs
# but the server does not verify them — mTLS is disabled for local dev).
tls-auth-clients no

# Allow password-based auth
requirepass contextiq_dev

# Allow connections from any address (Docker network is isolated)
protected-mode no
bind 0.0.0.0

# Persistence (snapshot + AOF for durability across restarts)
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"
dir /data
