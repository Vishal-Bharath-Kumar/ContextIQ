server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (OWASP)
    add_header X-Content-Type-Options  "nosniff"   always;
    add_header X-Frame-Options         "DENY"       always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:8000 http://localhost:8080" always;

    # SPA fallback — React Router handles all client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; HTML must not be cached
    location ~* \.(js|css|png|svg|woff2|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health probe endpoint
    location /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Proxy API requests to the backend gateway
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
