cert-manager:
  replicaCount: 3

  resources:
    requests: { cpu: "200m", memory: "256Mi" }
    limits:   { cpu: "1000m", memory: "1Gi" }

  webhook:
    replicaCount: 3
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits:   { cpu: "500m", memory: "256Mi" }

  cainjector:
    replicaCount: 3
    resources:
      requests: { cpu: "100m", memory: "128Mi" }
      limits:   { cpu: "500m", memory: "512Mi" }

  podDisruptionBudget:
    enabled: true
    minAvailable: 2
