{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: alembic-migration-{{ .Values.image.tag | lower | replace "." "-" | trunc 8 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook:               PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    "helm.sh/hook":                        pre-install,pre-upgrade
    "helm.sh/hook-delete-policy":          before-hook-creation
    "helm.sh/hook-weight":                 "-5"
spec:
  backoffLimit:          0
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: db-migration
      containers:
        - name: alembic-migration
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              . /vault/secrets/postgres.env
              export DATABASE_URL="postgresql+asyncpg://${DB_USERNAME}:${DB_PASSWORD}@{{ .Values.postgresql.host }}:5432/{{ .Values.postgresql.database }}?ssl=require"
              python -m scripts.ci.run_migration
          env:
            - name: ENVIRONMENT
              value: {{ .Values.global.environment | default "production" | quote }}
            - name: LOG_FORMAT
              value: json
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
{{- end }}
