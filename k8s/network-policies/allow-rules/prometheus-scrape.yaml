# Allow Prometheus (contextiq-observability) to scrape metrics from all contextiq namespaces.
# One ingress rule per namespace — applied to each target namespace so Prometheus can
# reach the /metrics endpoint on port 9000.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: contextiq-gateway
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: contextiq-observability
      ports:
        - protocol: TCP
          port: 9000
---
