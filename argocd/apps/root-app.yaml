# AC-7: Root App-of-Apps — points at argocd/apps/services/ directory.
# ArgoCD recursively discovers and syncs every Application manifest it contains.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: contextiq-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: contextiq
  source:
    repoURL:        https://github.com/your-org/contextiq.git
    targetRevision: HEAD
    path:           argocd/apps/services
  destination:
    server:    https://kubernetes.default.svc
    namespace: argocd   # Application objects live in the argocd namespace
  syncPolicy:
    automated:
      prune:    true    # remove resources deleted from Git
      selfHeal: true    # revert manual cluster changes
    syncOptions:
      - CreateNamespace=false          # namespaces managed by TASK-US045-01
      - PrunePropagationPolicy=foreground
      - ApplyOutOfSyncOnly=true
