# docker-compose.yml — ContextIQ local development stack
#
# Prerequisites:
#   - Docker Desktop (or Docker Engine + Compose plugin) installed
#   - Copy .env.local to .env and fill in any API keys (LANGFUSE, LLM providers)
#
# Quick start:
#   cp .env.local .env
#   docker compose up -d
#
# Service URLs once running:
#   API Gateway       http://localhost:8000     (docs at /docs)
#   Agent Worker      http://localhost:8001
#   Admin Portal      http://localhost:3000
#   Keycloak          http://localhost:8080/auth (admin/admin)
#   Jaeger UI         http://localhost:16686
#   MinIO Console     http://localhost:9001     (contextiq/contextiq_dev)
#   Qdrant UI         http://localhost:6333/dashboard
#   Neo4j Browser     http://localhost:7474     (neo4j/contextiq_dev)

x-app-env-file: &app-env-file
  - path: .env
    required: false     # Allows `docker compose up` before `cp .env.local .env`

# Shared env vars for all Python services. Anchored at the *environment dict*
# level (not the whole env_file+environment block) so that services needing
# extra/overridden vars can do `environment: {<<: *app-env-vars, EXTRA: ...}`
# and get a real merge — YAML's `<<:` does not deep-merge when re-declared at
# the service level (a service-level `environment:` key fully replaces one
# pulled in via `<<: *some-anchor-with-environment-key`, it does not merge).
x-app-env-vars: &app-env-vars
    # ── PostgreSQL ───────────────────────────────────────────────────────────
    # NOTE: no ?sslmode=require query param — asyncpg (unlike psycopg2) doesn't
    # accept a `sslmode` connect kwarg at all ("unexpected keyword argument
    # 'sslmode'"). TLS is instead enabled via connect_args={"ssl": "require"}
    # in src/data/database.py.
    DATABASE_URL: "postgresql+asyncpg://contextiq:contextiq_dev@postgres:5432/contextiq"
    DATABASE_READ_URL: "postgresql+asyncpg://contextiq:contextiq_dev@postgres:5432/contextiq"
    # ── Redis ────────────────────────────────────────────────────────────────
    REDIS_SENTINEL_HOSTS: "redis-sentinel:26379"
    REDIS_SENTINEL_MASTER: "contextiq-redis"
    REDIS_PASSWORD: "contextiq_dev"
    REDIS_URL: "rediss://:contextiq_dev@redis:6379/0?ssl_cert_reqs=none"
    # ── Kafka ────────────────────────────────────────────────────────────────
    KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    KAFKA_USERNAME: "contextiq"
    KAFKA_PASSWORD: "contextiq_dev"
    # ── Qdrant ───────────────────────────────────────────────────────────────
    QDRANT_URL: "http://qdrant:6333"
    # ── OpenSearch ────────────────────────────────────────────────────────────
    OPENSEARCH_URL: "http://opensearch:9200"
    # ── Neo4j ────────────────────────────────────────────────────────────────
    NEO4J_URI: "bolt://neo4j:7687"
    NEO4J_USERNAME: "neo4j"
    NEO4J_PASSWORD: "contextiq_dev"
    # ── MinIO ────────────────────────────────────────────────────────────────
    AUDIT_ARCHIVE_MINIO_ENDPOINT: "http://minio:9000"
    AUDIT_ARCHIVE_MINIO_ACCESS_KEY: "contextiq"
    AUDIT_ARCHIVE_MINIO_SECRET_KEY: "contextiq_dev"
    # ── Keycloak JWT Auth ────────────────────────────────────────────────────
    KEYCLOAK_URL: "http://keycloak:8080/auth"
    KEYCLOAK_REALM: "contextiq"
    KEYCLOAK_AUDIENCE: "contextiq-mcp-gateway"
    KEYCLOAK_CLIENT_ID: "contextiq-mcp-gateway"
    # Local-dev-only confidential client secret (see docker/keycloak/realm.json).
    # Used solely by src/auth/dev_login.py's password-grant exchange; never a
    # production credential. Override here if you change the realm.json secret.
    KEYCLOAK_CLIENT_SECRET: "contextiq-dev-client-secret"
    # ── OpenTelemetry Tracing ────────────────────────────────────────────────
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    OTEL_SERVICE_NAME: "contextiq-api"
    # ── Agent Worker ─────────────────────────────────────────────────────────
    CONTEXTIQ_AGENT_WORKER_BASE_URL: "http://agent-worker:8001"
    CONTEXTIQ_AGENT_WORKER_TIMEOUT_SECONDS: "10.0"
    # ── Vault (disabled — certs injected via volume mounts) ──────────────────
    CONTEXTIQ_VAULT_ADDR: ""
    CONTEXTIQ_VAULT_ROLE: ""
    # ── OPA (Open Policy Agent) ──────────────────────────────────────────────
    OPA_BASE_URL: "http://opa:8181"
    # ── Langfuse (disable for local dev unless you have a Langfuse instance) ─
    SUMMARIZATION_LANGFUSE_ENABLED: "false"
    # ── LLM Provider API Keys (from .env file) ───────────────────────────────
    # These are used by LiteLLM to invoke the actual model APIs.
    # Optional: only set the keys for providers you want to use.
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
    AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
    AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-}
    # ── Ollama (Local Models) ────────────────────────────────────────────────
    # Use host.docker.internal to reach Ollama running on the host machine
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    CONTEXTIQ_LLM_MODEL_ID: ${CONTEXTIQ_LLM_MODEL_ID:-ollama/llama3.2}
    ENTITY_LINKER_MODEL_ID: ${ENTITY_LINKER_MODEL_ID:-ollama/llama3.2}
    ENTITY_EXTRACTION_MODEL_ID: ${ENTITY_EXTRACTION_MODEL_ID:-ollama/llama3.2}
    EDGE_INFERENCE_MODEL_ID: ${EDGE_INFERENCE_MODEL_ID:-ollama/llama3.2}
    SUMMARIZATION_MODEL_NAME: ${SUMMARIZATION_MODEL_NAME:-ollama/llama3.2}
    # Extended timeout for pulling large models (e.g., 70B models)
    OLLAMA_PULL_TIMEOUT_SECONDS: "540"
    # ── Logging ──────────────────────────────────────────────────────────────
    CONTEXTIQ_LOG_LEVEL: "DEBUG"
    CONTEXTIQ_SERVER_VERSION: "0.1.0-local"

x-app-volumes: &app-volumes   # Shared volume block — TLS certs for all services
  - tls-certs:/tls:ro

x-app-depends: &app-depends   # Common service dependencies
  cert-init:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  redis-sentinel:
    condition: service_healthy
  kafka:
    condition: service_healthy
  qdrant:
    condition: service_healthy
  opensearch:
    condition: service_healthy
  neo4j:
    condition: service_healthy
  minio:
    condition: service_healthy
  keycloak:
    condition: service_healthy
  db-migrate:
    condition: service_completed_successfully
  kafka-init:
    condition: service_completed_successfully

services:

  # ── Certificate Generation (one-shot init container) ──────────────────────
  cert-init:
    image: alpine:3.19
    command: ["sh", "-c", "apk add --no-cache openssl >/dev/null && sh /scripts/gen-certs.sh"]
    volumes:
      - tls-certs:/tls
      - ./docker/certs/gen-certs.sh:/scripts/gen-certs.sh:ro
    user: root

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    depends_on:
      cert-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: contextiq
      POSTGRES_PASSWORD: contextiq_dev
      POSTGRES_DB: contextiq
    # SSL is enabled via postgresql.conf (appended by docker/postgres/01-ssl.sh)
    # rather than via -c flags here — see that script's header comment for why.
    command: ["postgres", "-c", "log_min_messages=WARNING"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/01-ssl.sh:/docker-entrypoint-initdb.d/01-ssl.sh:ro
      - ./docker/postgres/02-init-dbs.sql:/docker-entrypoint-initdb.d/02-init-dbs.sql:ro
    ports:
      # Host port 5433 (not 5432) to avoid clashing with a native PostgreSQL
      # install. Other containers still reach it via "postgres:5432".
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextiq -d contextiq"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Redis 7 (TLS, no plain-text port) ─────────────────────────────────────
  redis:
    # redis-stack-server bundles the RediSearch module, required by
    # langgraph-checkpoint-redis's AsyncRedisSaver (uses FT._LIST / FT.CREATE
    # to index checkpoints) — plain redis:7 doesn't support these commands.
    image: redis/redis-stack-server:latest
    depends_on:
      cert-init:
        condition: service_completed_successfully
    volumes:
      - redis-data:/data
      - tls-certs:/tls:ro
      # The image's entrypoint auto-detects /redis-stack.conf and loads it
      # alongside the RediSearch/RedisJSON/etc modules.
      - ./docker/redis/redis.conf:/redis-stack.conf:ro
    ports:
      # Host port 6380 (not 6379) to avoid clashing with a native Redis
      # install. Other containers still reach it via "redis:6379".
      - "6380:6379"
    healthcheck:
      # --insecure skips cert verification — only a liveness check, not security-critical
      test: ["CMD-SHELL", "redis-cli --tls --insecure -a contextiq_dev -p 6379 ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ── Redis Sentinel ────────────────────────────────────────────────────────
  redis-sentinel:
    image: redis:7
    depends_on:
      redis:
        condition: service_healthy
    # Sentinel rewrites its own config file at runtime to persist state, so it
    # can't run directly against the read-only template mount below. Copy the
    # template into the writable sentinel-data volume on first boot only
    # (cp -n preserves any state Sentinel has already written on restarts).
    entrypoint: ["sh", "-c", "cp -n /etc/redis/sentinel-template.conf /data/sentinel.conf && exec redis-sentinel /data/sentinel.conf"]
    volumes:
      - tls-certs:/tls:ro
      - ./docker/redis/sentinel.conf:/etc/redis/sentinel-template.conf:ro
      - sentinel-data:/data
    ports:
      - "26379:26379"
    healthcheck:
      # -a required now that sentinel.conf sets requirepass (needed so our
      # Sentinel-aware Redis client's AUTH on the sentinel connection itself
      # succeeds instead of failing with AuthenticationError/MasterNotFoundError).
      test: ["CMD-SHELL", "redis-cli --tls --insecure -a contextiq_dev -p 26379 ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ── Kafka (Apache Kafka, KRaft mode, SASL_SSL + SCRAM-SHA-512) ───────────
  kafka:
    build:
      context: ./docker/kafka
      dockerfile: Dockerfile
    depends_on:
      cert-init:
        condition: service_completed_successfully
    environment:
      KAFKA_USERNAME: "contextiq"
      KAFKA_PASSWORD: "contextiq_dev"
      KAFKA_CLUSTER_ID: "dGVzdC1sb2NhbC1rYWZrYQ"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - tls-certs:/tls:ro
    ports:
      - "9092:9092"
    healthcheck:
      # TCP-level check: verify Kafka is listening on 9092
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092' 2>/dev/null && echo ok || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    restart: unless-stopped

  # ── Qdrant Vector Database ────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.11.0
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      # qdrant/qdrant image has no curl/wget; use bash's /dev/tcp for a TCP-level check
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ── OpenSearch (BM25 keyword index for retrieval/indexing) ───────────────
  opensearch:
    image: opensearchproject/opensearch:2.11.1
    environment:
      discovery.type: "single-node"
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # ── Neo4j 5 (Knowledge Graph) ─────────────────────────────────────────────
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: "neo4j/contextiq_dev"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j-data:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ── MinIO (S3-compatible object storage for audit archives) ───────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "contextiq"
      MINIO_ROOT_PASSWORD: "contextiq_dev"
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ── MinIO bucket initialisation (one-shot) ────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 contextiq contextiq_dev &&
        mc mb --ignore-existing local/contextiq-audit-archive &&
        mc mb --ignore-existing local/contextiq-traces &&
        echo 'MinIO buckets ready.'
      "

  # ── HashiCorp Vault (dev mode — LOCAL DEV ONLY, in-memory, non-persistent) ─
  # Backs the knowledge_sources feature's VaultPathValidator (AC-5) and the
  # per-connector token providers (src/connectors/*/auth.py). NOT for
  # production use — real deployments use the k8s Vault (see scripts/vault/).
  vault:
    image: hashicorp/vault:1.15
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "contextiq-dev-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "vault status -format=json | grep -q '\"sealed\": false'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── Vault bootstrap (one-shot): AppRole + local dev connector secrets ──────
  vault-init:
    image: hashicorp/vault:1.15
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "contextiq-dev-root-token"
    entrypoint: >
      sh -c "
        vault auth enable approle 2>/dev/null || true &&
        printf '%s\n' 'path \"secret/data/connectors/*\" { capabilities = [\"read\", \"create\", \"update\"] }' 'path \"secret/metadata/connectors/*\" { capabilities = [\"read\", \"list\"] }' | vault policy write contextiq-connectors - &&
        vault write auth/approle/role/contextiq-connectors token_policies=\"contextiq-connectors\" secret_id_ttl=0 token_ttl=1h token_max_ttl=4h &&
        vault write auth/approle/role/contextiq-connectors/role-id role_id=contextiq-connectors-role &&
        (vault write auth/approle/role/contextiq-connectors/custom-secret-id secret_id=contextiq-connectors-secret 2>/dev/null || true) &&
        (vault kv get -format=json secret/connectors/github/my-org-pat >/dev/null 2>&1 || vault kv put secret/connectors/github/my-org-pat token=ghp_local_dev_dummy_token_1234 token_type=pat) &&
        echo 'Vault bootstrap complete.'
      "

  # ── OPA (Open Policy Agent) ──────────────────────────────────────────────
  opa:
    image: openpolicyagent/opa:latest
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=debug"
      - "--log-format=json"
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "/opa", "version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── Keycloak (Identity Provider) ─────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    depends_on:
      postgres:
        condition: service_healthy
    command: start-dev --http-relative-path /auth --import-realm
    environment:
      KC_DB: "postgres"
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_DB_USERNAME: "contextiq"
      KC_DB_PASSWORD: "contextiq_dev"
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_LOG_LEVEL: "WARN"
    volumes:
      - ./docker/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      # Keycloak image has no curl/wget; use bash's /dev/tcp for a TCP-level check
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  # ── Jaeger All-in-One (Distributed Tracing) ───────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      LOG_LEVEL: "warn"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC (used by OTEL_EXPORTER_OTLP_ENDPOINT)
      - "4318:4318"     # OTLP HTTP
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:16686 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Database Migration (one-shot) ─────────────────────────────────────────
  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./scripts:/app/scripts:ro
      - ./alembic.ini:/app/alembic.ini:ro
    # The base Dockerfile's ENTRYPOINT always launches uvicorn; override it
    # here so this one-shot job actually runs the migration script.
    entrypoint: ["python", "-m", "scripts.ci.run_migration"]
    command: []
    environment:
      DATABASE_URL: "postgresql+asyncpg://contextiq:contextiq_dev@postgres:5432/contextiq?sslmode=require"
    restart: "no"

  # ── Kafka Topic Bootstrap (one-shot) ──────────────────────────────────────
  kafka-init:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      cert-init:
        condition: service_completed_successfully
    volumes:
      - ./scripts:/app/scripts:ro
      - tls-certs:/tls:ro
    # The base Dockerfile's ENTRYPOINT always launches uvicorn; override it
    # here so this one-shot job actually runs the topic bootstrap script.
    entrypoint: ["python", "-m", "scripts.kafka.bootstrap_topics"]
    command: []
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KAFKA_USERNAME: "contextiq"
      KAFKA_PASSWORD: "contextiq_dev"
    restart: "no"

  # ── ContextIQ API Gateway ─────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      <<: *app-depends
      opa:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    env_file: *app-env-file
    environment:
      <<: *app-env-vars
      # Enables POST /auth/dev-login (password-grant against Keycloak) so the
      # Admin Portal can authenticate locally without the full OIDC redirect
      # flow. Real Keycloak-issued JWTs are still returned/validated normally
      # — this is NOT an auth bypass. Never set in production.
      CONTEXTIQ_DEV_LOGIN_ENABLED: "true"
      # ── Vault (knowledge_sources VaultPathValidator — local dev only) ──────
      KNOWLEDGE_SOURCE_VAULT_ADDR: "http://vault:8200"
      KNOWLEDGE_SOURCE_VAULT_ROLE_ID: "contextiq-connectors-role"
      KNOWLEDGE_SOURCE_VAULT_SECRET_ID: "contextiq-connectors-secret"
      KNOWLEDGE_SOURCE_VAULT_MOUNT: "secret"
      # ── GitHub connector's own Vault AppRole (src/connectors/github/auth.py) ──
      # Reuses the same contextiq-connectors AppRole seeded by vault-init;
      # required for GitHubTokenProvider.authenticate() to succeed at all —
      # without these the connector registers as enabled=False (auth failed).
      GITHUB_CONNECTOR_VAULT_ADDR: "http://vault:8200"
      GITHUB_CONNECTOR_VAULT_ROLE_ID: "contextiq-connectors-role"
      GITHUB_CONNECTOR_VAULT_SECRET_ID: "contextiq-connectors-secret"
      # Matches the dev secret vault-init seeds at secret/connectors/github/my-org-pat.
      # Overwrite this secret with a real PAT (see docs) instead of changing this path.
      GITHUB_CONNECTOR_VAULT_PATH: "connectors/github/my-org-pat"
    volumes:
      *app-volumes
    ports:
      - "8000:8000"
    healthcheck:
      # Slim Python image has no curl/wget; use python3's stdlib urllib instead
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── ContextIQ Agent Worker ────────────────────────────────────────────────
  agent-worker:
    build:
      context: .
      dockerfile: Dockerfile.agent
    depends_on:
      <<: *app-depends
      opa:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    env_file: *app-env-file
    environment:
      <<: *app-env-vars
      OTEL_SERVICE_NAME: "contextiq-agent-worker"
      CONTEXTIQ_ALLOW_DEGRADED_OPA_STARTUP: "true"
      REDIS_URL: "rediss://:contextiq_dev@redis:6379/0?ssl_cert_reqs=none"
      GITHUB_CONNECTOR_VAULT_ADDR: "http://vault:8200"
      GITHUB_CONNECTOR_VAULT_ROLE_ID: "contextiq-connectors-role"
      GITHUB_CONNECTOR_VAULT_SECRET_ID: "contextiq-connectors-secret"
      GITHUB_CONNECTOR_VAULT_PATH: "connectors/github/my-org-pat"
    volumes:
      *app-volumes
    ports:
      - "8001:8001"
    healthcheck:
      # Slim Python image has no curl/wget; use python3's stdlib urllib instead
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── ContextIQ Indexing Service ────────────────────────────────────────────
  indexing:
    build:
      context: .
      dockerfile: Dockerfile.indexing
    depends_on:
      <<: *app-depends
      vault-init:
        condition: service_completed_successfully
    env_file: *app-env-file
    environment:
      <<: *app-env-vars
      OTEL_SERVICE_NAME: "contextiq-indexing"
      # ── Vault (knowledge_sources config used during indexing connector build)
      # Matches API settings so indexing can resolve connector credentials too.
      KNOWLEDGE_SOURCE_VAULT_ADDR: "http://vault:8200"
      KNOWLEDGE_SOURCE_VAULT_ROLE_ID: "contextiq-connectors-role"
      KNOWLEDGE_SOURCE_VAULT_SECRET_ID: "contextiq-connectors-secret"
      KNOWLEDGE_SOURCE_VAULT_MOUNT: "secret"
      # Use the local fastembed model (BAAI/bge-small-en-v1.5) instead of
      # LiteLLM/OpenAI so this service works without an external API key.
      EMBEDDING_USE_LOCAL_MODEL: "true"
      # bge-small-en-v1.5 emits 384-dim vectors; Qdrant collection must match.
      QDRANT_VECTOR_SIZE: "384"
      GITHUB_CONNECTOR_VAULT_ADDR: "http://vault:8200"
      GITHUB_CONNECTOR_VAULT_ROLE_ID: "contextiq-connectors-role"
      GITHUB_CONNECTOR_VAULT_SECRET_ID: "contextiq-connectors-secret"
      GITHUB_CONNECTOR_VAULT_PATH: "connectors/github/my-org-pat"
    volumes:
      *app-volumes
    restart: unless-stopped

  # ── Admin Portal (pre-built React + Nginx) ────────────────────────────────
  admin-portal:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend/admin-portal/dist:/usr/share/nginx/html:ro
      - ./docker/nginx/admin-portal.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  tls-certs:        # Shared TLS certificates (generated by cert-init)
  postgres-data:    # PostgreSQL data directory
  redis-data:       # Redis persistence (AOF + RDB)
  sentinel-data:    # Redis Sentinel's writable runtime config copy
  kafka-data:       # Kafka log data
  qdrant-data:      # Qdrant vector storage
  opensearch-data:  # OpenSearch index data
  neo4j-data:       # Neo4j graph data
  minio-data:       # MinIO object storage

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  default:
    name: contextiq-local
    driver: bridge
