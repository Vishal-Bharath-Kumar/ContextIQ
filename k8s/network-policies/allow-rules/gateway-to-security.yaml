# Allow gateway → Keycloak JWKS + OPA policy evaluation
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-security
  namespace: contextiq-security
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: contextiq-gateway
      ports:
        - protocol: TCP
          port: 8080   # Keycloak
        - protocol: TCP
          port: 8181   # OPA
