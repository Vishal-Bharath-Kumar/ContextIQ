# ConfigMap patch for Redis TLS configuration enforcing TLS 1.3 only.
# Mount as /usr/local/etc/redis/redis.conf in the Redis Pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-tls-config
  namespace: contextiq-data
  labels:
    app.kubernetes.io/part-of:    contextiq
    app.kubernetes.io/component:  redis
data:
  redis.conf: |
    # AC-4: TLS 1.3 only for Redis client connections
    tls-port             6379
    tls-cert-file        /tls/tls.crt
    tls-key-file         /tls/tls.key
    tls-ca-cert-file     /tls/ca.crt
    tls-auth-clients     yes
    tls-protocols        "TLSv1.3"
    tls-ciphers          ""          # TLS 1.3 ciphers are fixed by RFC 8446; leave empty
    tls-replication      yes
    tls-cluster          yes
