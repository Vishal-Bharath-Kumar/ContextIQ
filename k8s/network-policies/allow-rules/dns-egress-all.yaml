# Allow kube-dns egress from all contextiq namespaces (required for service discovery).
# Without these rules all inter-service calls using cluster-local DNS names fail
# because the default-deny policy blocks egress to kube-system port 53.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: contextiq-gateway
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
