# Redis Sentinel configuration for local development — TLS enabled.
# Used by the `redis-sentinel` service in docker-compose.yml.
#
# The Sentinel:
#  - Listens on TLS port 26379 (matches REDIS_SENTINEL_HOSTS default port)
#  - Monitors the Redis master at redis:6379 (TLS)
#  - Uses quorum of 1 (single Sentinel is sufficient for local dev)

# Disable non-TLS port
port 0

# TLS listener
tls-port 26379
tls-cert-file /tls/redis-sentinel.crt
tls-key-file /tls/redis-sentinel.key
tls-ca-cert-file /tls/ca.crt
tls-auth-clients no

# Use TLS when connecting to Redis master/replicas
tls-replication yes

# Required for the "sentinel monitor" directive to accept a hostname (e.g.
# "redis") instead of a literal IP address. Without this, Sentinel treats
# the host field as IP-only and fails with "Can't resolve instance hostname"
# even though the hostname resolves fine via plain DNS lookups.
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Monitor the Redis master
# sentinel monitor <master-name> <host> <port> <quorum>
sentinel monitor contextiq-redis redis 6379 1

# Master password
sentinel auth-pass contextiq-redis contextiq_dev

# Password required from CLIENTS connecting to Sentinel itself (port 26379).
# Our app's Sentinel client (redis-py) always sends AUTH with REDIS_PASSWORD
# on the Sentinel connection too (sentinel_kwargs.password) — without this,
# Sentinel has no password configured and rejects the unsolicited AUTH command
# with an AuthenticationError, which surfaces as MasterNotFoundError.
requirepass contextiq_dev

# Timing settings
sentinel down-after-milliseconds contextiq-redis 5000
sentinel failover-timeout contextiq-redis 60000
sentinel parallel-syncs contextiq-redis 1

# Allow connections from any address
protected-mode no
bind 0.0.0.0
