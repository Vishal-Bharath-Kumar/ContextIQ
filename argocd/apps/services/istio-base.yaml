apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: contextiq
  source:
    repoURL:        https://istio-release.storage.googleapis.com/charts
    chart:          base
    targetRevision: "1.22.3"
  destination:
    server:    https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune:    true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true      # istio-system is managed by Istio, not TASK-US045-01
      - Replace=true              # CRDs require Replace rather than Apply
      - ApplyOutOfSyncOnly=true
