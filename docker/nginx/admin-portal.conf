server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Security headers (OWASP)
    add_header X-Content-Type-Options  "nosniff"   always;
    add_header X-Frame-Options         "DENY"       always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:8000 http://localhost:8080" always;

    # SPA fallback — React Router handles all client-side routing
    location / {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; HTML must not be cached
    location ~* \.(js|css|png|svg|woff2|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health probe endpoint
    location /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Proxy API requests to the backend gateway
    location /api/ {
        set                $api_upstream api:8000;
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        
        # Extended timeouts for long-running operations (model installation, sync jobs)
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}
