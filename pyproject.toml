[project]
name        = "contextiq"
version     = "0.1.0"
description = "ContextIQ — AI-powered developer context intelligence platform"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "fastmcp>=2.0.0",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  # Sync driver required by scripts/ci/run_migration.py — Alembic's
  # command.upgrade() runs against a synchronous SQLAlchemy engine even
  # though the application itself is fully async (asyncpg).
  "psycopg2-binary>=2.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "redis[asyncio]>=5.0",
  "aiokafka>=0.11",
  "kafka-python>=2.0,<3.0",
  "qdrant-client>=1.9",
  "neo4j>=5.19",
  "opensearch-py>=2.6",
  "aiobotocore>=2.13",
  "langgraph>=0.2",
  "langgraph-checkpoint-redis>=0.0.4",
  "litellm>=1.40",
  "fastembed>=0.3",
  "python-jose[cryptography]>=3.3",
  "cachetools>=5.3",
  "pybreaker>=1.0",
  "hvac>=2.1",
  "jsonschema>=4.22",
  "prometheus-client>=0.20",
  "croniter>=1.4",
  "structlog>=24.1",
  "langfuse>=2.0",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-grpc>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "opentelemetry-instrumentation-httpx>=0.45b0",
  "opentelemetry-instrumentation-redis>=0.45b0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "pytest-xdist>=3.5",
  "pytest-cov>=4.1",
  "pytest-httpx>=0.30",
  "pytest-benchmark>=4.0",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "ruff>=0.5",
  "pydantic[mypy]>=2.7",
  "httpx>=0.27",
  "respx>=0.20",
  "fakeredis[aioredis]>=2.20",
]
scripts = [
  "python-keycloak>=3.0",
  "pyyaml>=6.0",
]

# ---------------------------------------------------------------------------
# First-party connector entry points
# Third-party packages register themselves the same way in their own pyproject.toml
# ---------------------------------------------------------------------------
[project.entry-points."contextiq.connectors"]
# Example (uncomment when first-party connectors are added):
# github     = "contextiq_github_connector.connector:GitHubConnector"
# confluence = "contextiq_confluence_connector.connector:ConfluenceConnector"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 120
target-version = "py311"
exclude        = ["alembic/versions/"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "S",   # flake8-bandit (security)
  "ANN", # type annotation enforcement
]
ignore = [
  "ANN101",  # self annotation — not required
  "ANN102",  # cls annotation — not required
  "S101",    # assert usage — allowed in tests and invariant checks
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]  # mock credentials in test fixtures are not real secrets

# ---------------------------------------------------------------------------
# mypy — strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version         = "3.11"
strict                 = true
ignore_missing_imports = true
plugins                = ["pydantic.mypy"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
markers      = [
  "destructive: tests that modify cluster state (requires --run-destructive flag)",
  "slow: tests with wall-clock time > 30s",
  "real_middleware: middleware integration tests that run the real JWTAuthMiddleware dispatch",
]
addopts = "--strict-markers"
