apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-portal
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: contextiq
  source:
    repoURL:        https://github.com/your-org/contextiq.git
    targetRevision: HEAD
    path:           helm/charts/admin-portal
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server:    https://kubernetes.default.svc
    namespace: contextiq-admin
  syncPolicy:
    automated:
      prune:    true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
  ignoreDifferences:
    - group: apps
      kind:  Deployment
      jsonPointers:
        - /spec/replicas
