# AC-3: LimitRange ensures every container has a bounded resource footprint
# even when individual Deployment specs omit explicit limits.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: contextiq-agents
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: "4Gi"
      defaultRequest:
        cpu: "500m"
        memory: "1Gi"
      max:
        cpu: "8"
        memory: "16Gi"
      min:
        cpu: "100m"
        memory: "128Mi"
---
