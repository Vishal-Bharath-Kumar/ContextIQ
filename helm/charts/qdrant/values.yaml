qdrant:
  replicaCount: 3    # AC-1: 3-node distributed cluster

  image:
    tag: "v1.9.7"    # pinned for reproducibility

  config:
    cluster:
      enabled: true    # AC-1: enable distributed mode
      consensus:
        tick_period_ms: 100
    service:
      api_key: ""    # provided by Vault Agent at runtime (AC-6) — not set here
    storage:
      storage_path: /qdrant/storage    # encrypted PVC (TASK-US048-04)

  persistence:
    enabled:      true
    storageClass: contextiq-encrypted-gp3    # TASK-US048-04: encrypted EBS
    size:         50Gi

  resources:
    requests: { cpu: "500m",  memory: "2Gi" }
    limits:   { cpu: "2",     memory: "8Gi" }

  # AC-6: Vault Agent init-container injects the API key before Qdrant starts
  podAnnotations:
    vault.hashicorp.com/agent-inject:                 "true"
    vault.hashicorp.com/role:                         "agent-worker"
    vault.hashicorp.com/agent-pre-populate-only:      "true"    # init-only; API key is static
    vault.hashicorp.com/agent-inject-secret-qdrant:   "secret/data/contextiq/qdrant/api-key"
    vault.hashicorp.com/agent-inject-template-qdrant: |
      {{- with secret "secret/data/contextiq/qdrant/api-key" -}}
      export QDRANT__SERVICE__API_KEY="{{ .Data.data.api_key }}"
      {{- end }}

  # AC-1: require one Qdrant pod per K8s node for fault isolation
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: qdrant
          topologyKey: kubernetes.io/hostname

  # AC-7: Prometheus ServiceMonitor for /metrics endpoint
  metrics:
    serviceMonitor:
      enabled:   true
      namespace: contextiq-observability
      labels:
        app.kubernetes.io/part-of: contextiq

  # PDB: tolerate one node down out of three (1 failure = no data loss with replication_factor: 2)
  podDisruptionBudget:
    enabled:        true
    maxUnavailable: 1
