# AC-3: one ResourceQuota per namespace
# Sizing rationale:
#   contextiq-agents: highest CPU/memory — LangGraph workers + LLM calls
#   contextiq-gateway: medium — FastAPI + OTel middleware
#   contextiq-data: medium — PostgreSQL + Redis + Qdrant resident memory
#   contextiq-infra: medium — MinIO + Kafka brokers
#   contextiq-security: small — Keycloak (2 replicas) + OPA
#   contextiq-admin: small — nginx SPA + Admin API
#   contextiq-observability: small — Prometheus + Grafana + Jaeger
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: contextiq-agents
spec:
  hard:
    requests.cpu: "16"
    requests.memory: "32Gi"
    limits.cpu: "32"
    limits.memory: "64Gi"
    pods: "40"
    services: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: contextiq-gateway
spec:
  hard:
    requests.cpu: "8"
    requests.memory: "16Gi"
    limits.cpu: "16"
    limits.memory: "32Gi"
    pods: "20"
    services: "10"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: contextiq-data
spec:
  hard:
    requests.cpu: "8"
    requests.memory: "32Gi"
    limits.cpu: "16"
    limits.memory: "64Gi"
    pods: "20"
    services: "15"
    persistentvolumeclaims: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: contextiq-infra
spec:
  hard:
    requests.cpu: "8"
    requests.memory: "16Gi"
    limits.cpu: "16"
    limits.memory: "32Gi"
    pods: "20"
    services: "10"
    persistentvolumeclaims: "15"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: contextiq-security
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    pods: "15"
    services: "10"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: contextiq-admin
spec:
  hard:
    requests.cpu: "2"
    requests.memory: "4Gi"
    limits.cpu: "4"
    limits.memory: "8Gi"
    pods: "10"
    services: "10"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: contextiq-observability
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    pods: "15"
    services: "10"
    persistentvolumeclaims: "10"
