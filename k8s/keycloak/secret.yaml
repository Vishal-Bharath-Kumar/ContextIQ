# IMPORTANT: This file is a TEMPLATE — actual secret values must be provided
# via Vault Agent Injector or External Secrets Operator.
# NEVER commit real values to version control.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-credentials
  namespace: keycloak
  annotations:
    # Vault Agent sidecar pattern — replaces placeholder values at runtime
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "keycloak"
    vault.hashicorp.com/agent-inject-secret-db: "contextiq/data/keycloak/db"
type: Opaque
stringData:
  # Database credentials — populated by Vault Agent at pod start
  KC_DB_USERNAME: "PLACEHOLDER"
  KC_DB_PASSWORD: "PLACEHOLDER"
  # Initial admin user — required for first-startup admin user creation (Keycloak 24.x)
  # and for bootstrap_realm.py authentication.  Populated by Vault Agent.
  KEYCLOAK_ADMIN: "PLACEHOLDER"
  KEYCLOAK_ADMIN_PASSWORD: "PLACEHOLDER"
