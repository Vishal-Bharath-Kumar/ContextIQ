# k8s/keycloak/saml-idp-secret.yaml
#
# Placeholder Secret for SAML 2.0 on-premises IdP metadata.
# IMPORTANT: Contains no real certificate or credential data.
# Actual values are injected by Vault Agent at pod startup via annotations.
# NEVER commit real certificates, entity IDs, or SSO URLs to version control
# (OWASP A02 — Cryptographic Failures).
---
apiVersion: v1
kind: Secret
metadata:
  name: saml-idp-certificate
  namespace: keycloak
  annotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "keycloak"
    vault.hashicorp.com/agent-inject-secret-saml: "contextiq/data/keycloak/saml_idp"
type: Opaque
stringData:
  SAML_IDP_ENTITY_ID:    "PLACEHOLDER"
  SAML_IDP_SSO_URL:      "PLACEHOLDER"
  SAML_IDP_SIGNING_CERT: "PLACEHOLDER"   # Base64-encoded DER, no PEM headers/footers
