# ArgoCD pre-sync hook: all 6 Kafka topics must exist before any consumer/producer pod starts.
apiVersion: batch/v1
kind: Job
metadata:
  name:      kafka-topic-bootstrap
  namespace: contextiq-data
  annotations:
    argocd.argoproj.io/hook:               PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Wave -5: runs before consumer-group-registration job (wave -4)
    argocd.argoproj.io/sync-wave:          "-5"
spec:
  backoffLimit:          2      # retry up to 2× on transient broker unavailability
  activeDeadlineSeconds: 180
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject:                     "true"
        vault.hashicorp.com/role:                             "mcp-gateway"
        vault.hashicorp.com/agent-pre-populate-only:          "true"
        # Annotation suffix must match the desired filename under /vault/secrets/
        vault.hashicorp.com/agent-inject-secret-kafka.env:    "secret/data/contextiq/kafka/clients/mcp-gateway"
        vault.hashicorp.com/agent-inject-template-kafka.env: |
          {{- with secret "secret/data/contextiq/kafka/clients/mcp-gateway" -}}
          export KAFKA_USERNAME="{{ .Data.data.username }}"
          export KAFKA_PASSWORD="{{ .Data.data.password }}"
          {{- end }}
    spec:
      restartPolicy:      OnFailure
      serviceAccountName: kafka-bootstrap
      containers:
        - name:  bootstrap
          # Image tag replaced at deploy time by CI (e.g. via kustomize image patch or
          # sed substitution on the DEPLOY_IMAGE_TAG env var in the pipeline).
          image:   ghcr.io/your-org/contextiq-api:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              . /vault/secrets/kafka.env
              python scripts/kafka/bootstrap_topics.py
          env:
            - name:  KAFKA_BOOTSTRAP_SERVERS
              value: kafka.contextiq-data.svc.cluster.local:9092
          volumeMounts:
            - name:      kafka-tls
              mountPath: /tls
              readOnly:  true
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
      volumes:
        - name: kafka-tls
          secret:
            secretName: kafka-tls    # cert-manager Certificate (TASK-US048-01)
