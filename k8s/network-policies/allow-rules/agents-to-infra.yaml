# Allow agent workers → Kafka + MinIO
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agents-to-infra
  namespace: contextiq-infra
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: contextiq-agents
      ports:
        - protocol: TCP
          port: 9092   # Kafka
        - protocol: TCP
          port: 9000   # MinIO API
