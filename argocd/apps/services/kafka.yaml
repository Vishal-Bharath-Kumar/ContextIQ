apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: contextiq
  # Multi-source: upstream Bitnami Kafka chart + custom values from git ($values)
  sources:
    # Source 1: upstream Bitnami kafka Helm chart
    - repoURL:        https://charts.bitnami.com/bitnami
      chart:          kafka
      targetRevision: "29.3.13"    # pinned; matches Chart.yaml dependency version
      helm:
        valueFiles:
          - $values/helm/charts/kafka/values.yaml
          - $values/helm/charts/kafka/values-prod.yaml
    # Source 2: git repo supplying the custom values files (referenced as $values above)
    - repoURL:        https://github.com/your-org/contextiq.git
      targetRevision: HEAD
      ref:            values
  destination:
    server:    https://kubernetes.default.svc
    namespace: contextiq-data
  syncPolicy:
    automated:
      prune:    false    # never auto-prune — PVCs with broker data must not be deleted
      selfHeal: true
    syncOptions:
      - CreateNamespace=false    # namespace managed by TASK-US045-01
      - ApplyOutOfSyncOnly=true
  ignoreDifferences:
    - group: apps
      kind:  StatefulSet
      jsonPointers:
        - /spec/replicas    # ignore manual replica adjustments
