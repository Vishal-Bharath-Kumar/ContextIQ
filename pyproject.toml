[project]
name        = "contextiq"
version     = "0.1.0"
description = "ContextIQ — AI-powered developer context intelligence platform"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "redis[asyncio]>=5.0",
  "aiokafka>=0.11",
  "kafka-python>=2.0",
  "qdrant-client>=1.9",
  "neo4j>=5.19",
  "opensearch-py>=2.6",
  "aiobotocore>=2.13",
  "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "pytest-xdist>=3.5",
  "pytest-cov>=4.1",
  "mypy>=1.10",
  "ruff>=0.5",
  "pydantic[mypy]>=2.7",
  "httpx>=0.27",
  "respx>=0.20",
]
scripts = [
  "python-keycloak>=3.0",
  "pyyaml>=6.0",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 120
target-version = "py311"
exclude        = ["alembic/versions/"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "S",   # flake8-bandit (security)
  "ANN", # type annotation enforcement
]
ignore = [
  "ANN101",  # self annotation — not required
  "ANN102",  # cls annotation — not required
  "S101",    # assert usage — allowed in tests and invariant checks
]

# ---------------------------------------------------------------------------
# mypy — strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version         = "3.11"
strict                 = true
ignore_missing_imports = true
plugins                = ["pydantic.mypy"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
markers      = [
  "destructive: tests that modify cluster state (requires --run-destructive flag)",
  "slow: tests with wall-clock time > 30s",
  "real_middleware: middleware integration tests that run the real JWTAuthMiddleware dispatch",
]
addopts = "--strict-markers"
