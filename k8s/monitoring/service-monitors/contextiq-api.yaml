apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: contextiq-api
  namespace: contextiq
  labels:
    prometheus: contextiq
spec:
  selector:
    matchLabels:
      app: contextiq-api
  namespaceSelector:
    matchNames:
      - contextiq
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: false
