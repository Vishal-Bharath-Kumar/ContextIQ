# Allow agent workers → all data stores
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agents-to-data
  namespace: contextiq-data
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: contextiq-agents
      ports:
        - protocol: TCP
          port: 5432   # PostgreSQL
        - protocol: TCP
          port: 6379   # Redis
        - protocol: TCP
          port: 6333   # Qdrant HTTP
        - protocol: TCP
          port: 6334   # Qdrant gRPC
        - protocol: TCP
          port: 7474   # Neo4j HTTP
        - protocol: TCP
          port: 7687   # Neo4j Bolt
